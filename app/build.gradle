apply plugin: 'com.android.application'

// Native CPU tuning. Override with: ./gradlew assembleRelease -Pwinlator.targetSoc=generic
def targetSoc = (project.findProperty('winlator.targetSoc') ?: 'sm8550').toString()

android {
    namespace 'com.winlator'
    compileSdk 36

    defaultConfig {
        applicationId 'com.winlator'
        minSdkVersion 26
        // targetSdk must stay at 28: from API 29 on, Android forbids executing
        // binaries extracted to the app data dir (W^X), which breaks box64/wine.
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        versionCode 34
        versionName "11.2-s23"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DWINLATOR_TARGET_SOC=${targetSoc}"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        // Non-debuggable build: ART compiles the Java X server / renderer fully
        // (debuggable apps run with reduced JIT/AOT optimizations) and native
        // code is built with -O3 instead of -O0.
        release {
            minifyEnabled true
            shrinkResources false
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    ndkVersion '28.2.13676358'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.7-4@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
}
