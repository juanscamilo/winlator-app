name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      target_soc:
        description: "Native CPU tuning (sm8550 = Snapdragon 8 Gen 2 / Galaxy S23, generic = any ARMv8)"
        default: "sm8550"
        type: choice
        options: [ sm8550, generic ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pwinlator.targetSoc=${{ github.event.inputs.target_soc || 'sm8550' }}

      - uses: actions/upload-artifact@v4
        with:
          name: winlator-${{ github.event.inputs.target_soc || 'sm8550' }}-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
