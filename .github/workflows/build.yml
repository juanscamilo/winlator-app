name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      target_soc:
        description: "Native CPU tuning (sm8550 = Snapdragon 8 Gen 2 / Galaxy S23, generic = any ARMv8)"
        default: "sm8550"
        type: choice
        options: [ sm8550, generic ]

env:
  # Bundled browser: ungoogled-chromium (BSD-3-Clause), pinned by version and checksum.
  CHROMIUM_VERSION: 157.0.8103.38-1.1
  CHROMIUM_SHA256: 7aae503c42974753de7e2fa3910106b8594b027e7e567baf7e69016b2a4e6c74
  BOX64_REF: v0.4.5-1
  BOX64_VERSION: 0.4.5
  TARGET_SOC: ${{ github.event.inputs.target_soc || 'sm8550' }}

jobs:
  # Box64 compiled natively on an ARM64 runner (Ubuntu 24.04 = glibc 2.39, the same
  # glibc as Winlator's rootfs), tuned for the Snapdragon 8 Gen 2 (-DSD8G2: ARMv9-A
  # without SVE, which Qualcomm does not expose).
  box64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Build Box64
        run: |
          sudo apt-get install -y --no-install-recommends cmake zstd python3
          git clone --depth 1 --branch "$BOX64_REF" https://github.com/ptitSeb/box64
          case "$TARGET_SOC" in
            sm8550) CPU_OPT="-DSD8G2=ON" ;;
            *)      CPU_OPT="-DARM64=ON" ;;
          esac
          ROOTFS_LIB=/data/data/com.winlator/files/rootfs/lib
          cmake -S box64 -B box64/build $CPU_OPT -DARM_DYNAREC=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--dynamic-linker=$ROOTFS_LIB/ld-linux-aarch64.so.1 -Wl,-rpath,$ROOTFS_LIB"
          cmake --build box64/build -j"$(nproc)"

      - name: Check and package Box64
        run: |
          BIN=box64/build/box64
          readelf -l "$BIN" | grep "Requesting program interpreter: /data/data/com.winlator/files/rootfs/lib/ld-linux-aarch64.so.1"
          readelf -d "$BIN" | grep RUNPATH
          # Winlator's rootfs ships glibc 2.39: refuse to package a binary needing anything newer.
          if objdump -T "$BIN" | grep -oE "GLIBC_2\.[0-9]+" | sort -uV | tail -1 | awk -F. '$2 > 39 {exit 1}'; then echo "glibc OK"; else echo "needs glibc > 2.39"; exit 1; fi
          ./"$BIN" --version || true
          mkdir -p pkg/usr/local/bin
          cp "$BIN" pkg/usr/local/bin/box64
          # Drop DWARF debug info (not loaded at runtime): smaller APK and faster extraction.
          strip --strip-debug pkg/usr/local/bin/box64
          ls -la pkg/usr/local/bin/box64
          chmod 644 pkg/usr/local/bin/box64
          tar --owner=0 --group=0 --numeric-owner -C pkg -cf - . | zstd -19 -T0 -o "box64-$BOX64_VERSION.tzst"

      - uses: actions/upload-artifact@v5
        with:
          name: box64-${{ env.TARGET_SOC }}
          path: box64-*.tzst
          if-no-files-found: error

  # Winlator File Manager (tools/wfm) cross-compiled with MinGW-w64.
  wfm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build wfm.exe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          cd tools/wfm
          mkdir -p obj
          CC=x86_64-w64-mingw32-gcc
          CFLAGS="-O2 -std=c99 -DUNICODE -D_UNICODE -DCOBJMACROS -DWINVER=0x0600 -Wall -Iinclude -Iinclude/libcdio"
          for f in src/*.c; do $CC $CFLAGS -c "$f" -o "obj/$(basename "${f%.c}").o"; done
          x86_64-w64-mingw32-windres -Iinclude -Ires -i res/resource.rc -o obj/resource.o
          $CC -o wfm.exe obj/*.o -s -lcomctl32 -lgdi32 -lole32 -luuid ./libcdio.dll -Wl,--subsystem,windows
          file wfm.exe || true
          ls -la wfm.exe

      - uses: actions/upload-artifact@v5
        with:
          name: wfm
          path: tools/wfm/wfm.exe
          if-no-files-found: error

  build:
    needs: [box64, wfm]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The GitHub-hosted runner already ships the Android SDK; only install what is missing.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Replace the generic Box64 shipped in the repo with the SoC-tuned build.
      - uses: actions/download-artifact@v5
        with:
          name: box64-${{ env.TARGET_SOC }}
          path: app/src/main/assets/box64

      # Replace wfm.exe inside rootfs_patches.tzst with the freshly built one.
      - uses: actions/download-artifact@v5
        with:
          name: wfm
          path: wfm-build

      - name: Update rootfs_patches with the fixed wfm.exe
        run: |
          set -e
          ASSET=app/src/main/assets/rootfs_patches.tzst
          mkdir patches
          zstd -dc "$ASSET" | tar -x -C patches
          test -f patches/home/xuser/.wine/drive_c/windows/wfm.exe
          cp wfm-build/wfm.exe patches/home/xuser/.wine/drive_c/windows/wfm.exe
          tar --owner=0 --group=0 --numeric-owner -C patches -cf - . | zstd -19 -T0 -f -o "$ASSET"
          rm -rf patches

      # Pack Chromium as an app asset; it is extracted to <rootfs>/opt/chromium on first use.
      - name: Bundle Chromium
        run: |
          set -e
          NAME="ungoogled-chromium_${CHROMIUM_VERSION}_windows_x64"
          curl -fsSL -o chromium.zip "https://github.com/ungoogled-software/ungoogled-chromium-windows/releases/download/${CHROMIUM_VERSION}/${NAME}.zip"
          echo "${CHROMIUM_SHA256}  chromium.zip" | sha256sum -c -
          unzip -q chromium.zip
          mkdir -p chromium-pkg/opt
          mv "$NAME" chromium-pkg/opt/chromium
          test -f chromium-pkg/opt/chromium/chrome.exe
          # Keep only a few UI languages to save space.
          find chromium-pkg/opt/chromium/locales -name "*.pak" ! -name "en-US.pak" ! -name "pt-BR.pak" ! -name "pt-PT.pak" ! -name "es.pak" ! -name "es-419.pak" ! -name "ru.pak" -delete
          mkdir -p app/src/main/assets/chromium
          tar --owner=0 --group=0 --numeric-owner -C chromium-pkg -cf - . | zstd -19 -T0 -f -o app/src/main/assets/chromium/chromium.tzst
          echo "$CHROMIUM_VERSION" > app/src/main/assets/chromium/version.txt
          ls -la app/src/main/assets/chromium
          rm -rf chromium.zip chromium-pkg

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          ls -la app/src/main/assets/box64
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pwinlator.targetSoc=$TARGET_SOC

      - uses: actions/upload-artifact@v5
        with:
          name: winlator-${{ env.TARGET_SOC }}-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
